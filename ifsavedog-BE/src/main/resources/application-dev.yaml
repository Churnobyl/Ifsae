spring:
  config:
    active: dev

  datasource:
    driver-class-name: ${DEV_DATABASE_CLASS_NAME}
    url: ${DEV_DATABASE_URL}
    username: ${DEV_DATABASE_USERNAME}
    password: ${DEV_DATABASE_PASSWORD}

  sql:
    init:
      mode: never
  #   sql 작성 이후 모드 변경
  #   mode: always
  #      data-locations: classpath:sql/data_dev.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect
  #    defer-datasource-initialization: true
  #    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT}

frontend:
  url: http://localhost:5173
spring:
  application:
    name: ifsae

  # Timezone Setting
  jackson:
    time-zone: Asia/Seoul

  # Import .env file
  config:
    import: optional:file:.env[.properties]

  # Database Settings
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  # JPA Settings
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect

  # Mail Settings
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  # Redis Settings
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 5
          max-idle: 5
          min-idle: 2
  security:
    user:
      name: admin
      password: admin
      roles: USER, ADMIN

# Server Settings
server:
  port: 8080

# JWT Settings
jwt:
  secret:
    key: ${JWT_KEY}
  access:
    expiration: ${ACCESS_TOKEN_EXPIRATION_PERIOD}
  refresh:
    expiration: ${REFRESH_TOKEN_EXPIRATION_PERIOD}

# S3 Settings
cloud:
  aws:
    region:
      static: ap-southeast-2
    stack:
      auto: false
    s3:
      bucket: ${BUCKET_NAME}
    credentials:
      accessKey: ${ACCESS_KEY}
      secretKey: ${SECRET_KEY}

# Swagger Settings
springdoc:
  swagger-ui:
    path: /
    enabled: true
    groups-order: asc
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  override-with-generic-response: false
  model-and-view-allowed: true
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
